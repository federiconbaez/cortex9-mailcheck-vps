[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcheck-vps"
version = "0.1.0"
description = "Read-only mail deliverability diagnosis from inside the VPS (Postfix + OpenDKIM + DNS)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
mailcheck = "mailcheck.cli:main"

[tool.setuptools]
packages = ["mailcheck"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, B bugbear, UP pyupgrade, S flake8-bandit (security rules)
select = ["E", "W", "F", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# unittest-style asserts and throwaway test fixtures are fine in tests and the lab harness
"tests/**" = ["S101", "S108"]
"lab/**" = ["S101", "S108"]
