name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.3"
      - name: Ruff (pycodestyle, pyflakes, bugbear, pyupgrade, bandit rules; config in pyproject.toml)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "cryptography>=50.0.0"
      - name: Tests (a skipped test fails the job)
        run: python -m tests.run
      - name: Lab measurement (12 broken configs + healthy control)
        run: python -m lab.measure

  dig-q:
    # Checks the dig behavior DigResolver relies on: with -q, a name starting with
    # "-" or "+" is taken as a name, never as an option. No real lookup is needed:
    # +qr prints the query as sent, before any answer (or timeout).
    runs-on: ubuntu-latest
    steps:
      - name: Install dig if missing
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)
      - name: Names starting with - and + after -q are sent as names
        run: |
          for name in "-fexample" "+tcp"; do
            out=$(dig +qr +time=1 +tries=1 @127.0.0.1 -t TXT -q "$name" 2>&1 || true)
            echo "$out"
            echo "$out" | grep -F -- ";${name}." || { echo "dig did not send $name as the query name"; exit 1; }
          done
