name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "cryptography>=41"
      - name: Tests (a skipped test fails the job)
        run: python -m tests.run
      - name: Lab measurement (12 broken configs + healthy control)
        run: python -m lab.measure
