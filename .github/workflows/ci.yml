name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.17.3"
      - name: Ruff (pycodestyle, pyflakes, bugbear, pyupgrade, bandit rules; config in pyproject.toml)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "cryptography>=41"
      - name: Tests (a skipped test fails the job)
        run: python -m tests.run
      - name: Lab measurement (12 broken configs + healthy control)
        run: python -m lab.measure
